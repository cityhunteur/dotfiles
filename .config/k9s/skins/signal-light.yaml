# Signal light interface with Nord resource and syntax colours.
k9s:
  body:
    fgColor: "#171717"
    bgColor: "#e5e9f0"
    logoColor: "#646464"
  prompt:
    fgColor: "#171717"
    bgColor: "#e5e9f0"
    suggestColor: "#17646f"
  info:
    fgColor: "#5E81AC"
    sectionColor: "#2E3440"
  dialog:
    fgColor: "#2E3440"
    bgColor: "#E5E9F0"
    buttonFgColor: "#ECEFF4"
    buttonBgColor: "#5E81AC"
    buttonFocusFgColor: "#17646f"
    buttonFocusBgColor: "#e5e9f0"
    labelFgColor: "#D08770"
    fieldFgColor: "#2E3440"
  frame:
    border:
      fgColor: "#D8DEE9"
      focusColor: "#17646f"
    menu:
      fgColor: "#2E3440"
      keyColor: "#17646f"
      numKeyColor: "#17646f"
    crumbs:
      fgColor: "#ECEFF4"
      bgColor: "#5E81AC"
      activeColor: "#81A1C1"
    status:
      newColor: "#88C0D0"
      modifyColor: "#81A1C1"
      addColor: "#A3BE8C"
      pendingColor: "#D08770"
      errorColor: "#BF616A"
      highlightColor: "#EBCB8B"
      killColor: "#BF616A"
      completedColor: "#4C566A"
    title:
      fgColor: "#2E3440"
      bgColor: "#E5E9F0"
      highlightColor: "#17646f"
      counterColor: "#81A1C1"
      filterColor: "#B48EAD"
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - "#5E81AC"
        - "#BF616A"
      defaultChartColors:
        - "#5E81AC"
        - "#BF616A"
    table:
      fgColor: "#171717"
      bgColor: "#e5e9f0"
      cursorFgColor: "#17646f"
      cursorBgColor: "#e5e9f0"
      header:
        fgColor: "#646464"
        bgColor: "#e5e9f0"
        sorterColor: "#17646f"
    xray:
      fgColor: "#2E3440"
      bgColor: "#ECEFF4"
      cursorColor: "#5E81AC"
      graphicColor: "#81A1C1"
      showIcons: false
    yaml:
      keyColor: "#5E81AC"
      colonColor: "#4C566A"
      valueColor: "#2E3440"
    logs:
      fgColor: "#2E3440"
      bgColor: "#ECEFF4"
      indicator:
        fgColor: "#ECEFF4"
        bgColor: "#5E81AC"
        toggleOnColor: "#A3BE8C"
        toggleOffColor: "#D8DEE9"
