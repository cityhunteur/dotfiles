# =============================================================================
# STARSHIP: Meister / Continuum Glacier 2.0.0
# =============================================================================
add_newline = false
command_timeout = 1000
scan_timeout = 50

# Every colour is a Glacier semantic role from tokens/meister-continuum.json.
# Starship cannot follow the terminal theme itself, so ~/.config/zsh/glacier.zsh
# selects the matching palette per prompt: this file uses glacier_dark, and a
# cached copy with `palette = "glacier_light"` is used in light mode.
#   rule      rails and fill (┌ └ ─): borderControl grey, matching the tmux
#             status-line rules (borderHairline vanishes on the terminal canvas)
#   muted     readable metadata: brackets, markers, tool versions
#   primary   values: directory, branch, failure marker
#   accent    the only colour: the prompt character ❯
# Like the tmux status line, the prompt is neutral grey/black; states are told
# apart by their markers (! + ? ✘ …), never by hue.
palette = "glacier_dark"

format = """\
[┌ ](rule)$directory $git_branch $git_state$git_status\
$fill\
$golang$nodejs$bun$deno$python$rust$java$swift$zig$c$lua$ruby\
$terraform$docker_context$helm$kubernetes$aws$cmd_duration$jobs\
$line_break\
[└ ](rule)$character"""

[fill]
symbol = "─"
style = "rule"

[directory]
format = "[⟪ ](muted)[$path]($style)[ ⟫  ](muted)"
style = "primary bold"
truncation_length = 1
truncate_to_repo = true

# Failure adds a ✘ marker and vi normal mode flips direction (❮); the
# accent stays on the prompt character in every state.
[character]
success_symbol = "[❯](accent bold)"
error_symbol = "[✘ ](primary bold)[❯](accent bold)"
vimcmd_symbol = "[❮](accent bold)"

# =============================================================================
# Git
# =============================================================================
[git_branch]
format = "[⌥](muted) [$branch]($style)"
style = "primary"

# Each state keeps its own marker in grey; a conflict is the one marker in
# primary bold, because it blocks work.
[git_status]
format = " [$conflicted$stashed$staged$modified$renamed$untracked$deleted$ahead_behind]($style)"
style = "muted"
ahead = "[⇡${count}](muted) "
behind = "[⇣${count}](muted) "
diverged = "[⇡${ahead_count} ⇣${behind_count}](muted) "
conflicted = "[~](primary bold) "
untracked = "[?](muted) "
modified = "[!](muted) "
staged = "[+](muted) "
renamed = "[»](muted) "
deleted = "[×](muted) "
stashed = "[*](muted) "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "primary"

# =============================================================================
# Languages & Tools (right-aligned). Metadata, so muted ink; the symbol
# identifies the tool, not a colour.
# Every symbol is single-width, covered by PragmataPro, and distinct from the
# tmux session/window vocabulary in ~/.config/zsh/tmux-symbols.zsh (only ⎈
# is shared, with the same meaning: Kubernetes).
# =============================================================================
[nodejs]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "⏣"
style = "muted"

[python]
format = "[⟨](muted)[$symbol $version(::$virtualenv)]($style)[⟩](muted) "
symbol = "◆"
style = "muted"
detect_extensions = []
python_binary = []

[golang]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "▦"
style = "muted"

[rust]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⚒"
style = "muted"

[java]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "◉"
style = "muted"

[terraform]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "△"
style = "muted"

[kubernetes]
format = '[⟨](muted)[$symbol $context::$namespace]($style)[⟩](muted) '
symbol = "⎈"
style = "muted"
disabled = false

[docker_context]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "◈"
style = "muted"

[bun]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "◭"
style = "muted"

[deno]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "◮"
style = "muted"

[swift]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⟁"
style = "muted"

[zig]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⋈"
style = "muted"

[c]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⊕"
style = "muted"

[lua]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "☾"
style = "muted"

[ruby]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "◊"
style = "muted"

[helm]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⌖"
style = "muted"

# =============================================================================
# Status
# =============================================================================
[aws]
format = '[⟨](muted)[$symbol $profile]($style)[⟩](muted) '
symbol = "▲"
style = "muted"
disabled = false

# Last command took 2 s or more.
[cmd_duration]
format = "[⟨](muted)[⧖ $duration]($style)[⟩](muted) "
style = "muted"
min_time = 2_000

# Background jobs, with their count.
[jobs]
format = "[⟨](muted)[$symbol$number]($style)[⟩](muted) "
symbol = "⚙ "
style = "muted"
number_threshold = 1
symbol_threshold = 1

# =============================================================================
# Glacier palettes (kept last: TOML tables swallow every key that follows them)
# =============================================================================
[palettes.glacier_dark]   # themes.continuum-dark
primary = "#ECEFF4"
muted = "#AAB7C9"
rule = "#8999AD"
accent = "#88C0D0"

[palettes.glacier_light]  # themes.continuum-light
primary = "#2E3440"
muted = "#5A677B"
rule = "#748298"
accent = "#286F89"
