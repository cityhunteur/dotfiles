# =============================================================================
# STARSHIP — FUTURISTIC NORD
# =============================================================================
add_newline = false
command_timeout = 1000
scan_timeout = 50

# Colours are ANSI names, not hex, so the prompt follows the Ghostty theme
# (Nord in dark mode, Nord Light in light mode) like the tmux status bar does.
#   bright-black = rails, brackets, fill (chrome)
#   blue = Frost 3, cyan = Frost 2, bright-cyan = Frost 1
#   green / yellow / red / purple = Aurora; orange has no ANSI slot, so the
#   former orange accents (diverged, java, aws) use yellow

format = """\
[┌ ](bold bright-black)$directory $git_branch $git_state$git_status\
$fill\
$golang$nodejs$python$rust$java$terraform$docker_context$kubernetes$aws\
$line_break\
[└ ](bold bright-black)$character"""

[fill]
symbol = "─"
style = "bright-black"

[directory]
format = "[⟪ ](bright-black)[$path]($style)[ ⟫  ](bright-black)"
style = "blue bold"
truncation_length = 1
truncate_to_repo = true

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](purple bold)"

# =============================================================================
# Git
# =============================================================================
[git_branch]
format = "[⌥](bright-black) [$branch]($style)"
style = "cyan bold"

[git_status]
format = " [$conflicted$stashed$staged$modified$renamed$untracked$deleted$ahead_behind]($style)"
style = "bright-black"
ahead = "[⇡${count}](green) "
behind = "[⇣${count}](red) "
diverged = "[⇡${ahead_count} ⇣${behind_count}](yellow) "
conflicted = "[~](red) "
untracked = "[?](cyan) "
modified = "[!](yellow) "
staged = "[+](green) "
renamed = "[»](purple) "
deleted = "[×](red) "
stashed = "[*](blue) "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# =============================================================================
# Languages & Tools (right-aligned)
# =============================================================================
[nodejs]
format = "[⟨](bright-black)[$symbol]($style)[⟩](bright-black) "
symbol = "⏣"
style = "green bold"

[python]
format = "[⟨](bright-black)[$symbol $version(::$virtualenv)]($style)[⟩](bright-black) "
symbol = "◆"
style = "yellow bold"
detect_extensions = []
python_binary = []

[golang]
format = "[⟨](bright-black)[$symbol $version]($style)[⟩](bright-black) "
symbol = "▦"
style = "bright-cyan bold"

[rust]
format = "[⟨](bright-black)[$symbol $version]($style)[⟩](bright-black) "
symbol = "⊙"
style = "red bold"

[java]
format = "[⟨](bright-black)[$symbol]($style)[⟩](bright-black) "
symbol = "◉"
style = "yellow"

[terraform]
format = "[⟨](bright-black)[$symbol]($style)[⟩](bright-black) "
symbol = "△"
style = "purple bold"

[kubernetes]
format = '[⟨](bright-black)[$symbol $context::$namespace]($style)[⟩](bright-black) '
symbol = "⎈"
style = "blue bold"
disabled = false

[docker_context]
format = "[⟨](bright-black)[$symbol]($style)[⟩](bright-black) "
symbol = "◈"
style = "blue bold"

# =============================================================================
# Status
# =============================================================================
[aws]
format = '[⟨](bright-black)[$symbol $profile]($style)[⟩](bright-black) '
symbol = "▲"
style = "yellow bold"
disabled = false
