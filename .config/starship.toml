# =============================================================================
# STARSHIP: Meister / Continuum — Signal 3.0.0
# =============================================================================
add_newline = false
command_timeout = 1000
scan_timeout = 50

# Colours derive from the Meister / Continuum — Signal 3.0.0 canonical tokens.
# The fixed dark terminal uses signal_dark; signal_light retains black actions
# for an explicitly selected light appearance.
#   rule      rails and fill (┌ └ ─): nordControlBoundary on the shared Nord canvas
#   muted     readable metadata: brackets, markers, tool versions
#   primary   values: directory, branch, failure marker
#   accent    contrasting black/white prompt character ❯
# Like the tmux status line, the prompt is neutral; states are told
# apart by their markers (! + ? ✘ …), never by hue.
palette = "signal_dark"

format = """\
[┌ ](rule)$directory $git_branch $git_state$git_status\
$fill\
$golang$nodejs$bun$deno$python$rust$java$swift$zig$c$lua$ruby\
$terraform$docker_context$helm$kubernetes$aws$cmd_duration$jobs\
$line_break\
[└ ](rule)$character"""

[fill]
symbol = "─"
style = "rule"

[directory]
format = "[⟪ ](muted)[$path]($style)[ ⟫  ](muted)"
style = "primary bold"
truncation_length = 1
truncate_to_repo = true

# Failure adds a ✘ marker and vi normal mode flips direction (❮); the
# accent stays on the prompt character in every state.
[character]
success_symbol = "[❯](accent bold)"
error_symbol = "[✘ ](primary bold)[❯](accent bold)"
vimcmd_symbol = "[❮](accent bold)"

# =============================================================================
# Git
# =============================================================================
[git_branch]
format = "[⌥](muted) [$branch]($style)"
style = "primary"

# Each state keeps its own marker in grey; a conflict is the one marker in
# primary bold, because it blocks work.
[git_status]
format = " [$conflicted$stashed$staged$modified$renamed$untracked$deleted$ahead_behind]($style)"
style = "muted"
ahead = "[⇡${count}](muted) "
behind = "[⇣${count}](muted) "
diverged = "[⇡${ahead_count} ⇣${behind_count}](muted) "
conflicted = "[~](primary bold) "
untracked = "[?](muted) "
modified = "[!](muted) "
staged = "[+](muted) "
renamed = "[»](muted) "
deleted = "[×](muted) "
stashed = "[*](muted) "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "primary"

# =============================================================================
# Languages & Tools (right-aligned). Metadata, so muted ink; the symbol
# identifies the tool, not a colour.
# Symbols retain the existing vocabulary; local font coverage and cell width
# require validation. They are distinct from the
# tmux session/window vocabulary in ~/.config/zsh/tmux-symbols.zsh (only ⎈
# is shared, with the same meaning: Kubernetes).
# =============================================================================
[nodejs]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "⏣"
style = "muted"

[python]
format = "[⟨](muted)[$symbol $version(::$virtualenv)]($style)[⟩](muted) "
symbol = "◆"
style = "muted"
detect_extensions = []
python_binary = []

[golang]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "▦"
style = "muted"

[rust]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⚒"
style = "muted"

[java]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "◉"
style = "muted"

[terraform]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "△"
style = "muted"

[kubernetes]
format = '[⟨](muted)[$symbol $context::$namespace]($style)[⟩](muted) '
symbol = "⎈"
style = "muted"
disabled = false

[docker_context]
format = "[⟨](muted)[$symbol]($style)[⟩](muted) "
symbol = "◈"
style = "muted"

[bun]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "◭"
style = "muted"

[deno]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "◮"
style = "muted"

[swift]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⟁"
style = "muted"

[zig]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⋈"
style = "muted"

[c]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⊕"
style = "muted"

[lua]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "☾"
style = "muted"

[ruby]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "◊"
style = "muted"

[helm]
format = "[⟨](muted)[$symbol $version]($style)[⟩](muted) "
symbol = "⌖"
style = "muted"

# =============================================================================
# Status
# =============================================================================
[aws]
format = '[⟨](muted)[$symbol $profile]($style)[⟩](muted) '
symbol = "▲"
style = "muted"
disabled = false

# Last command took 2 s or more.
[cmd_duration]
format = "[⟨](muted)[⧖ $duration]($style)[⟩](muted) "
style = "muted"
min_time = 2_000

# Background jobs, with their count.
[jobs]
format = "[⟨](muted)[$symbol$number]($style)[⟩](muted) "
symbol = "⚙ "
style = "muted"
number_threshold = 1
symbol_threshold = 1

# =============================================================================
# Signal palettes; action ink follows the appearance.
# Keep these last: TOML tables swallow every key that follows them.
# =============================================================================
[palettes.signal_dark]   # themes.continuum-dark
primary = "#F2F2F2"
muted = "#A0A0A0"
rule = "#8A8A8A"
accent = "#F2F2F2"

[palettes.signal_light]  # light appearance
primary = "#171717"
muted = "#646464"
rule = "#858585"
accent = "#171717"
