# Meister / Continuum — Signal 3.0.0: dark tmux application chrome.
# Values derive from Signal canonical tokens; glacier-* filenames are compatibility IDs.
# Match the Nord blue/black canvas; selection uses the requested subtle navy/black fill.
# Preserve ANSI syntax colours, keybindings and the configured font.
# Keep hex lowercase: format expansion treats #F/#D as aliases, breaking mouse ranges.

set -g @canvas "#2e3440"
set -g @primary "#f2f2f2"
set -g @muted "#a0a0a0"
set -g @hairline "#353535"
set -g @rule "#8a8a8a"
set -g @link "#7aa2ff"
set -g @accent "#7aa2ff"
# User-requested subdued selection fill; keep focus marked independently.
set -g @tint "#1b2230"
set -g @selected "#f2f2f2"

set -g status-style "bg=#2e3440,fg=#f2f2f2"
set -g window-status-style "bg=#2e3440,fg=#a0a0a0,noreverse"
set -g window-status-current-style "bg=#1b2230,fg=#f2f2f2,noreverse"
set -g pane-border-style "fg=#8a8a8a"
set -g pane-active-border-style "fg=#7aa2ff"
set -g display-panes-colour "#a0a0a0"
set -g display-panes-active-colour "#7aa2ff"
set -g message-style "bg=#1b2230,fg=#f2f2f2"
set -g message-command-style "bg=#1b2230,fg=#f2f2f2"
set -g mode-style "bg=#43546a,fg=#eceff4"
set -g clock-mode-colour "#7aa2ff"
