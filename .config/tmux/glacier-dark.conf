# Meister / Continuum — Signal 3.0.0: dark tmux application chrome.
# Values derive from Signal canonical tokens; glacier-* filenames are compatibility IDs.
# Nord source cells, ANSI palette, keybindings and client-theme hooks remain independent.

set -g @canvas "#111111"
set -g @primary "#F2F2F2"
set -g @muted "#A0A0A0"
set -g @hairline "#353535"
set -g @rule "#7A7A7A"
set -g @link "#7AA2FF"
set -g @accent "#7AA2FF"
set -g @tint "#182B52"
set -g @selected "#F2F2F2"

set -g status-style "bg=#111111,fg=#F2F2F2"
set -g window-status-style "bg=#111111,fg=#A0A0A0,noreverse"
set -g window-status-current-style "bg=#182B52,fg=#F2F2F2,noreverse"
set -g pane-border-style "fg=#8A8A8A"
set -g pane-active-border-style "fg=#7AA2FF"
set -g display-panes-colour "#A0A0A0"
set -g display-panes-active-colour "#7AA2FF"
set -g message-style "bg=#182B52,fg=#F2F2F2"
set -g message-command-style "bg=#182B52,fg=#F2F2F2"
set -g mode-style "bg=#43546A,fg=#ECEFF4"
set -g clock-mode-colour "#7AA2FF"
