# Meister / Continuum Glacier 2.0.0, continuum-dark roles for tmux.
# Values come from tokens/meister-continuum.json (themes.continuum-dark).
# Sourced by ~/.tmux.conf on load and on every client theme change.

# Ink roles, read by the status formats as #{@role}.
set -g @primary  "#ECEFF4"   # fgPrimary: session, branch, values
set -g @muted    "#AAB7C9"   # fgMuted: metadata, brackets, inactive windows
set -g @hairline "#374152"   # borderHairline: decorative rules, pane separation
set -g @rule     "#8999AD"   # borderControl: status-line rules (grey, visible)
set -g @link     "#88C0D0"   # fgLink: selected label (current window)
set -g @accent   "#88C0D0"   # signalAccent: focus outline
set -g @tint     "#304958"   # signalTint: selection field

# Styles that cannot read user options, so they are set here directly.
set -g pane-border-style        "fg=#374152"
set -g pane-active-border-style "fg=#88C0D0"
set -g display-panes-colour        "#374152"
set -g display-panes-active-colour "#88C0D0"
set -g message-style         "bg=#304958,fg=#88C0D0"
set -g message-command-style "bg=#304958,fg=#88C0D0"
set -g mode-style            "bg=#304958,fg=#88C0D0"
setw -g clock-mode-colour    "#88C0D0"
