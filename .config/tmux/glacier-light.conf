# Meister / Continuum Glacier 2.0.0, continuum-light roles for tmux.
# Values come from tokens/meister-continuum.json (themes.continuum-light).
# Sourced by ~/.tmux.conf on load and on every client theme change.

# Ink roles, read by the status formats as #{@role}.
set -g @primary  "#2E3440"   # fgPrimary: session, branch, values
set -g @muted    "#5A677B"   # fgMuted: metadata, brackets, inactive windows
set -g @hairline "#DDE4EE"   # borderHairline: decorative rules, pane separation
set -g @rule     "#748298"   # borderControl: status-line rules (grey, visible)
set -g @link     "#236B85"   # fgLink: selected label (current window)
set -g @accent   "#286F89"   # signalAccent: focus outline
set -g @tint     "#E2EFF5"   # signalTint: selection field

# Styles that cannot read user options, so they are set here directly.
set -g pane-border-style        "fg=#DDE4EE"
set -g pane-active-border-style "fg=#286F89"
set -g display-panes-colour        "#DDE4EE"
set -g display-panes-active-colour "#286F89"
set -g message-style         "bg=#E2EFF5,fg=#236B85"
set -g message-command-style "bg=#E2EFF5,fg=#236B85"
set -g mode-style            "bg=#E2EFF5,fg=#236B85"
setw -g clock-mode-colour    "#286F89"
