# Meister / Continuum — Signal 3.0.0: light tmux application chrome.
# Values derive from Signal canonical tokens; glacier-* filenames are compatibility IDs.
# Nord source cells, ANSI palette, keybindings and client-theme hooks remain independent.

set -g @canvas "#FAFAFA"
set -g @primary "#171717"
set -g @muted "#646464"
set -g @hairline "#DADADA"
set -g @rule "#858585"
set -g @link "#2457E6"
set -g @accent "#2457E6"
set -g @tint "#EAF0FF"
set -g @selected "#171717"

set -g status-style "bg=#FAFAFA,fg=#171717"
set -g window-status-style "bg=#FAFAFA,fg=#646464,noreverse"
set -g window-status-current-style "bg=#EAF0FF,fg=#171717,noreverse"
set -g pane-border-style "fg=#858585"
set -g pane-active-border-style "fg=#2457E6"
set -g display-panes-colour "#646464"
set -g display-panes-active-colour "#2457E6"
set -g message-style "bg=#EAF0FF,fg=#171717"
set -g message-command-style "bg=#EAF0FF,fg=#171717"
set -g mode-style "bg=#AEBED1,fg=#2E3440"
set -g clock-mode-colour "#2457E6"
