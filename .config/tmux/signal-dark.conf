# Meister / Continuum — Signal 3.0.0: dark tmux application chrome.
# Values derive from Signal canonical tokens; host canvas and action ink follow the explicit user choices.
# The prefix and active-window markers share the Starship prompt accent.
# Preserve ANSI syntax colours, keybindings and the configured font.
# Keep hex lowercase: format expansion treats #F/#D as aliases, breaking mouse ranges.

set -g @canvas "#2e3440"
set -g @primary "#f2f2f2"
set -g @muted "#a0a0a0"
set -g @hairline "#353535"
set -g @rule "#8a8a8a"
set -g @link "#f2f2f2"
set -g @accent "#88d8de"
set -g @tint "#2e3440"
set -g @selected "#f2f2f2"

set -g status-style "bg=#2e3440,fg=#f2f2f2"
set -g window-status-style "bg=#2e3440,fg=#a0a0a0,noreverse"
set -g window-status-current-style "bg=#2e3440,fg=#f2f2f2,noreverse"
set -g window-status-format "   #[fg=#{@muted}]#I #W"
set -g window-status-current-format " #[fg=#{@accent}]▸ #[fg=#{@primary}]#I #W"
set -g pane-border-style "fg=#8a8a8a"
set -g pane-active-border-style "fg=#f2f2f2"
set -g display-panes-colour "#a0a0a0"
set -g display-panes-active-colour "#f2f2f2"
set -g message-style "bg=#2e3440,fg=#f2f2f2"
set -g message-command-style "bg=#2e3440,fg=#f2f2f2"
set -g mode-style "bg=#43546a,fg=#eceff4"
set -g clock-mode-colour "#f2f2f2"
