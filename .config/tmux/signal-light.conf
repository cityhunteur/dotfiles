# Meister / Continuum — Signal 3.0.0: light tmux application chrome.
# Values derive from Signal canonical tokens; host canvas and action ink follow the explicit user choices.
# Nord source cells, ANSI palette, keybindings and client-theme hooks remain independent.
# Keep hex lowercase: format expansion treats #F/#D as aliases, breaking mouse ranges.

set -g @canvas "#eceff4"
set -g @primary "#646464"
set -g @muted "#646464"
set -g @hairline "#dadada"
set -g @rule "#858585"
set -g @link "#171717"
set -g @accent "#646464"
set -g @tint "#eceff4"
set -g @selected "#171717"

set -g status-style "bg=#eceff4,fg=#646464"
set -g window-status-style "bg=#eceff4,fg=#646464,noreverse"
set -gF window-status-current-style "bg=#{@canvas},fg=#{@muted},noreverse"
set -g @status-label " #I#{?#{>:#{window_panes},1},.#P,} #W "
set -g window-status-format "  #{E:@status-label}"
set -g window-status-current-format "  #[fg=#{@canvas},bg=#{@muted}]#{E:@status-label}#[default]"
set -g pane-border-style "fg=#858585"
set -g pane-active-border-style "fg=#171717"
set -g display-panes-colour "#646464"
set -g display-panes-active-colour "#171717"
set -g message-style "bg=#eceff4,fg=#646464"
set -g message-command-style "bg=#eceff4,fg=#646464"
set -g mode-style "bg=#aebed1,fg=#2e3440"
set -g clock-mode-colour "#171717"
