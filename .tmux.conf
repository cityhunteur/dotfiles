# No bells at all
set -g bell-action none

# Change the prefix key to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# macOS clipboard support
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload tmux config without relying on tmux-sensible's run-shell wrapper.
bind-key R source-file ~/.tmux.conf \; display-message "Sourced ~/.tmux.conf!"

# Turn the mouse on with copy mode support
set -g mouse on
setw -g mode-keys vi

set -g @continuum-restore 'on'
set -g @resurrect-dir '$HOME/.local/share/tmux/resurrect'

# Plugins (load before custom status to let tpm work, but override status after)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
run -b '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# Nord Status Bar (follows the Ghostty Nord / Nord Light theme live)
# =============================================================================
# Uses terminal colour names so it follows the Ghostty theme, and
# #{client_theme} (tmux 3.6+) so the hierarchy holds in both modes:
#   content = terminal foreground (fg=default)
#   chrome  = rails, brackets, inactive windows; dim in both themes
#             dark:  brightblack (#596377 on #2e3440)
#             light: white       (#a5abb6 on #e5e9f0)
set -g @chrome "#{?#{==:#{client_theme},light},white,brightblack}"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=default"

# Redraw the status line immediately when focus changes.
set-hook -g after-select-pane 'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'

set -g status-left-length 60
set -g status-right-length 120

# Left: session name. The bar sits at the bottom, so the rail closes with └
# (mirrors the └ ❯ line of the starship prompt).
set -g status-left "#[fg=#{E:@chrome}]└ ⟪ #[fg=default]#S#[fg=#{E:@chrome}] ⟫ #{prefix_highlight} "

# Right: git branch of the active pane (hidden outside a repo), host, time.
# git-segment.sh prints its own styled "─── ⟨ ⌥ branch ⟩ " or nothing.
set -g status-right "#(/Users/pravin/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#(~/.config/tmux/git-segment.sh '#{pane_current_path}' '#{E:@chrome}')#[fg=#{E:@chrome}]─── ⟨ #[fg=default]#H#[fg=#{E:@chrome}] ⟩ ─── ⟨ #[fg=default]%H:%M#[fg=#{E:@chrome}] ⟩"

# Window tabs: inactive in chrome, current in bold foreground.
set -g window-status-separator ""
set -g window-status-style "bg=default,fg=default,noreverse"
set -g window-status-current-style "bg=default,fg=default,noreverse"
set -g window-status-format "    #[fg=#{E:@chrome}]#I #W"
set -g window-status-current-format "    #[fg=default,bold]#I #W"

# Pane borders. Style options don't expand formats, so switch them with the
# theme hooks, and set them once at load for the current client.
set -g pane-active-border-style "fg=cyan"
set -g display-panes-active-colour "cyan"
set-hook -g client-dark-theme  'set -g pane-border-style fg=black ; set -g display-panes-colour black'
set-hook -g client-light-theme 'set -g pane-border-style fg=white ; set -g display-panes-colour white'
if -F '#{==:#{client_theme},light}' \
  'set -g pane-border-style fg=white ; set -g display-panes-colour white' \
  'set -g pane-border-style fg=black ; set -g display-panes-colour black'

# Messages
set -g message-style "bg=black,fg=cyan"
set -g message-command-style "bg=black,fg=cyan"

# Clock
setw -g clock-mode-colour "cyan"

# Prefix highlight (rendered by #{prefix_highlight} in status-left)
set -g @prefix_highlight_fg "black"
set -g @prefix_highlight_bg "cyan"

# Cursor shape passthrough. On reset, return to the terminal's own default
# (Ghostty: cursor-style) instead of hard-coding a shape.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[0 q'

# Let new attaches refresh Ghostty's shell-integration features (cursor shape).
set -ga update-environment GHOSTTY_SHELL_FEATURES
